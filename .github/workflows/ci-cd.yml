name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install -r service-python-ocr/requirements.txt
      - run: pytest service-python-ocr/tests
      - run: mvn -B test
        working-directory: engine-java-core
      - run: docker build -t warranty-vault-ocr ./service-python-ocr
      - run: docker build -t warranty-vault-java ./engine-java-core
      - run: docker build -t warranty-vault-frontend ./frontend-react
