name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
        working-directory: service-python-ocr

      - name: Test Python OCR service
        run: python -m pytest
        working-directory: service-python-ocr

      - name: Test Java core
        run: mvn -B test
        working-directory: engine-java-core

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend-react

      - name: Build frontend
        run: npm run build
        working-directory: frontend-react

      - name: Build OCR Docker image
        run: docker build -t warranty-vault-ocr ./service-python-ocr

      - name: Build Java Docker image
        run: docker build -t warranty-vault-java ./engine-java-core

      - name: Build frontend Docker image
        run: docker build -t warranty-vault-frontend ./frontend-react
